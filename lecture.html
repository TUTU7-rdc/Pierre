    <style>
        body {
            font-family: 'Inter', sans-serif;

<body class="bg-white">

    <script>
        const DATABASE = [
            {

                texte: `
        
        <h2>Jeunesse Chrétienne</h2>
        <p>Nous vivons dans les derniers jours, l’ère la plus sombre de l’histoire de l’humanité où plusieurs démons sont à l’œuvre. Ils cherchent à détruire tout le monde, et particulièrement les jeunes sont plus dans leur collimateur. Pour s’en sortir, ces jeunes ont besoin de beaucoup d’enseignements mais aussi et surtout être pleinement remplis du Saint-Esprit. C’est dans cette optique que l’étude des jeunes est organisée afin de pouvoir leur donner une bonne base dans le Message de l’heure en dehors des prédications qui sont prêchées dans chaque réunion.</p>
        
        <div class="my-16 px-6 border-l-4 border-[#A3432F] py-4 bg-gray-50/50">
            <blockquote class="text-2xl md:text-4xl serif italic text-gray-800 leading-tight">
                "Comment le jeune homme rendra-t-il pur son sentier ? En se dirigeant d'après ta parole. Je te cherche de tout mon cœur : Ne me laisse pas égarer loin de tes commandements ! Je serre ta parole dans mon cœur, Afin de ne pas pécher contre toi. <span class="text-[#A3432F]"></span>"
            </blockquote>
            <div class="mt-4 flex items-center gap-3">
                <div class="w-8 h-px bg-gray-300"></div>
                <cite class="text-[10px] tracking-[0.3em] uppercase font-bold text-gray-500 italic"> Psaumes 119 : 9 – 11</cite>
            </div>
        </div>

        <p>Considérons pendant quelques instants ce jeune homme dont il était question dans Luc 18:18-22. Sans doute ce garçon était-il né dans un bon foyer, tout comme vous les jeunes. Il avait été élevé par de bons parents. En effet, cela s’est confirmé quand Jésus lui a présenté les commandements de Dieu. Il a dit : “Je les ai observés dès ma jeunesse.” Cela montrait qu’il avait—qu’il avait été—qu’il avait été bien élevé. Il n’était pas un petit vaurien. Et, vous savez, il—il avait reçu une éducation qui lui permettait de savoir ce qui était bien, tout comme vous, les jeunes. Peut-être avait-il grandi auprès d’une maman et d’un papa qui craignaient Dieu, et qui—qui—qui l’avaient bien enseigné pendant son enfance. Bon, ça, c’est bien.</p>
        <p>Et ce garçon avait une ambition : il désirait recevoir la Vie Éternelle. Il a dit : “Bon maître, que dois-je faire pour hériter la Vie Éternelle?”
Voyez, malgré tout ce que vous possédez dans ce monde, l’âme, qui se trouve au dedans de vous, vous dit qu’il y a quelque chose dont vous avez besoin, quelque chose que vous ne possédez pas. En ayant simplement la richesse… Ou, ce n’est pas nécessairement toujours la richesse. Ça pourrait être la popularité, une jolie jeune fille, elle peut tourner ses pensées vers sa beauté. Peut-être qu’elle est très populaire à l’école. Peut- être que le garçon peut avoir toutes les filles qu’il veut. Il a un certain sentiment de sécurité. La sécurité, ce n’est pas ça. Ces choses flétriront, comme la fleur dans le champ. Voyez? Elles disparaîtront. Ça ne va pas tarder. Encore quelques révolutions du soleil, et elles disparaîtront, mais ensuite vous avez une âme qui, elle, doit vivre Éternellement.</p>
        
        <h2>Prière du Prophète Branham</h2>
        <p>Commencez par dix minutes le matin. Sans téléphone, sans musique, juste vous et votre respiration. Observez vos pensées passer comme des nuages sans vous y accrocher. C'est le début de la liberté intérieure.</p>
        <p>Seigneur Jésus! Ces jeunes, les hommes et les femmes de demain, s’il y a un lendemain. Nous devons les former, Seigneur. Nous ressentons ce fardeau, de les former comme s’il y aura un lendemain. S’il n’y en a pas, alors, c’est aujourd’hui ou jamais. Et, Père, nous savons que nul n’est agréé devant Toi. Aucune chair ne peut se glorifier. Aucune instruction, si bonnes ces choses soient-elles, aucune bonne œuvre, aucune institution religieuse, aucune psychologie, rien ne peut confirmer Dieu, rien d’autre que le Saint-Esprit. Il est l’Instrument, Dieu Lui-même sous la forme de la Vie Éternelle, qui peut venir à chacun de nous individuellement. Et nous sommes reconnaissants pour cela.</p>
        <p>Assurément, c’est ce qui a été exprimé lorsque Pierre a fait sa confession. Jésus lui a répondu : “Ce ne sont pas la chair et le Sang qui t’ont révélé cela. Tu n’as jamais appris cela dans un séminaire. Tu n’as jamais appris cela à l’école.” C’est quelque chose de personnel, quelque chose que chaque individu doit recevoir. Tu as dit : “Sur ce roc Je bâtirai Mon Église, et les portes du séjour des morts ne pourront pas La vaincre.” Nous sommes reconnaissants pour cela, Seigneur. Cette Voix-là est encore vivante ce soir. Et il y a encore des postes, des avant-postes, des postes d’écoute, des stations de réception, de foi, qui peuvent accepter Cela. Nous prions que ces enfants, chacun d’eux, reçoivent Cela, Seigneur, dans leur cœur. Et qu’ils se souviennent que ce qui compte, ce n’est pas ce qu’ils font pour être bons, mais qu’ils… Dieu ne nous juge pas par ce que nous faisons, mais par ce que nous avons accepté. C’est par notre foi que nous sommes sauvés, et non par nos œuvres. Ainsi nous prions, Père Céleste, qu’ils saisissent maintenant la vision, qu’ils voient, et qu’ils entendent cette glorieuse invitation Éternelle : “Viens, suis-Moi.”
</p>
<p>Puisse chacun d’eux, Seigneur, se détourner de toutes les choses du monde, de cette vie mortelle de pacotille. Les voici ce soir, avec leurs cheveux blonds dorés, certains avec les cheveux noirs, les yeux sombres, les yeux bleus, ils sont là, au mieux de leur forme. Et comme l’a dit ce grand écrivain : “Souviens-toi de ton Créateur pendant les jours de ta jeunesse, avant que les jours mauvais arrivent. Alors tu n’y prendras point de plaisir.” Et, Seigneur Jésus, Tu as dit à Pierre : “Quand tu étais plus jeune, tu te levais et tu allais où tu voulais. Mais quand tu seras vieux, quelqu’un te mènera où tu ne voudras pas aller.” Qu’ils se souviennent : “Le jour, c’est aujourd’hui. Le moment, c’est maintenant.” Accorde-le, Père.</p>
<p>Je réclame tous ceux qui sont ici ce soir, à commencer par mon propre enfant, jusqu’à chaque enfant ici. Je sens que Tu m’as confié la tâche de veiller sur eux. Je les réclame tous — des griffes de Satan et de la mort, à la Vie en Jésus-Christ. Amen.

</p>
    `
            },
            {
                id: 2,
                cat: "COMMUNAUTÉ",
                titre: "La force du collectif",
                meta: "Écrit par Pierre Tutu • 8 MIN DE LECTURE",
                image: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80",
                texte: `
        <p>Je vous assure, mes frères, si nous pouvions avoir un tel enthousiasme, [sachant] que notre message est urgent… Nous n’avons pas de temps pour des niaiseries. Apportons le Message à un peuple, à un peuple qui a enduré des persécutions…
C’est la chose essentielle : répandre le Message, car nous vivons dans une heure où il est plus tard que nous ne le pensons.</p>
        
        <div class="my-12 py-10 border-y border-gray-100 relative text-center">
            <span class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-4 text-[#A3432F]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v3c0 1.25.75 2 2 2h3c0 4-2 6-3 6l1 3zm11 0c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v3c0 1.25.75 2 2 2h3c0 4-2 6-3 6l1 3z"/></svg>
            </span>
            <blockquote class="text-2xl md:text-3xl serif italic text-gray-800 leading-tight">
                "Et alors, quand les voyageurs qui entraient dans le pays entendaient ces nouvelles au sujet de ce grand Don de Dieu, ils allaient le dire aux autres. C’est ainsi que la Bonne Nouvelle était répandue : <span class="text-[#A3432F]">d’une personne à l’autre.</span>."
            </blockquote>
            <cite class="block mt-6 text-[10px] tracking-[0.3em] uppercase font-bold text-gray-400">— Sagesse Collective</cite>
        </div>

        <h2>Partager pour multiplier</h2>
        <p>Quand nous partageons un témoignage ou une épreuve, nous ne nous contentons pas de parler : nous permettons aux autres de se reconnaître et de trouver la force de continuer. La vulnérabilité partagée devient alors notre plus grande force collective.</p>
        <p>Dans nos rencontres hebdomadaires, nous voyons des vies se transformer simplement par l'écoute et la bienveillance. C'est là que réside le véritable miracle de la fraternité.</p>
    `
            },
            {
                id: 3,
                cat: "MÉDITATION",
                titre: "L'art de la gratitude au réveil",
                meta: "Écrit par Pierre Tutu. • 4 MIN DE LECTURE",
                image: "https://media.thegospelcoalition.org/wp-content/uploads/sites/5/2023/03/15220355/do-revival-comes-1920x1080.jpg",
                texte: `
        <p>Je vous assure, mes frères, si nous pouvions avoir un tel enthousiasme, [sachant] que notre message est urgent… Nous n’avons pas de temps pour des niaiseries. Apportons le Message à un peuple, à un peuple qui a enduré des persécutions…
C’est la chose essentielle : répandre le Message, car nous vivons dans une heure où il est plus tard que nous ne le pensons.</p>
        
        <div class="my-12 py-10 border-y border-gray-100 relative text-center">
            <span class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-4 text-[#A3432F]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v3c0 1.25.75 2 2 2h3c0 4-2 6-3 6l1 3zm11 0c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v3c0 1.25.75 2 2 2h3c0 4-2 6-3 6l1 3z"/></svg>
            </span>
            <blockquote class="text-2xl md:text-3xl serif italic text-gray-800 leading-tight">
                "Et alors, quand les voyageurs qui entraient dans le pays entendaient ces nouvelles au sujet de ce grand Don de Dieu, ils allaient le dire aux autres. C’est ainsi que la Bonne Nouvelle était répandue : <span class="text-[#A3432F]">d’une personne à l’autre.</span>."
            </blockquote>
            <cite class="block mt-6 text-[10px] tracking-[0.3em] uppercase font-bold text-gray-400">— Sagesse Collective</cite>
        </div>

        <h2>Partager pour multiplier</h2>
        <p>Quand nous partageons un témoignage ou une épreuve, nous ne nous contentons pas de parler : nous permettons aux autres de se reconnaître et de trouver la force de continuer. La vulnérabilité partagée devient alors notre plus grande force collective.</p>
        <p>Dans nos rencontres hebdomadaires, nous voyons des vies se transformer simplement par l'écoute et la bienveillance. C'est là que réside le véritable miracle de la fraternité.</p>
    `
            }
        ];

        function initArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));
            const article = DATABASE.find(a => a.id === id);

            if (article) {
                document.getElementById('art-cat').textContent = article.cat;
                document.getElementById('nav-cat').textContent = article.cat;
                document.getElementById('art-titre').textContent = article.titre;
                document.getElementById('art-meta').textContent = article.meta;
                document.getElementById('art-image-container').innerHTML = `
                    <img src="${article.image}" class="w-full h-[300px] md:h-[500px] object-cover rounded-[2.5rem] shadow-xl">
                `;
                document.getElementById('art-texte').innerHTML = article.texte;
                document.title = article.titre + " | GRACE";
            } else {
                window.location.href = 'communaute.html';
            }
            lucide.createIcons();
        }

        function share(platform) {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(document.getElementById('art-titre').textContent);
            let shareUrl = '';
            if (platform === 'facebook') shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
            if (platform === 'twitter') shareUrl = `https://twitter.com/intent/tweet?text=${title}&url=${url}`;
            if (platform === 'whatsapp') shareUrl = `https://api.whatsapp.com/send?text=${title}%20${url}`;
            window.open(shareUrl, '_blank');
        }

        window.addEventListener('DOMContentLoaded', initArticle);
    </script>
</body>

</html>
